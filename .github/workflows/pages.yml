name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'lib/**'
      - 'scripts/build-demo.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      # configure-pages fails on private repos (Pages needs a paid plan there),
      # so only run the Pages-specific steps when the repo is public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v5
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages is only available for public repositories on the free plan.
    # Skip the deploy job (instead of failing) while the repo is private, so
    # this workflow stays green. Flip the repo to public to activate Pages.
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
