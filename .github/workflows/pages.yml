name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'lib/**'
      - 'scripts/build-demo.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages is only available for public repositories on the free
      # plan. The event payload's `repository.private` proved unreliable on
      # push triggers, so query the API for the authoritative value.
      - id: visibility
        run: |
          private=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('private'))")
          echo "repository private=${private}"
          if [ "${private}" = "False" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - if: steps.visibility.outputs.public == 'true'
        uses: actions/configure-pages@v5
      - if: steps.visibility.outputs.public == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    name: Deploy to Pages
    needs: build
    if: needs.build.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
